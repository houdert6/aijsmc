        function checkCactusDamageLocal(mob) {
            const world = getActiveWorld();
            const bx = Math.round(mob.mesh.position.x / BLOCK_SIZE) * BLOCK_SIZE;
            const by = Math.round((mob.mesh.position.y - 10) / BLOCK_SIZE) * BLOCK_SIZE;
            const bz = Math.round(mob.mesh.position.z / BLOCK_SIZE) * BLOCK_SIZE;
            
            const nearbyOffsets = [
                {x:0, y:0, z:0}, {x:1, y:0, z:0}, {x:-1, y:0, z:0},
                {x:0, y:0, z:1}, {x:0, y:0, z:-1},
                {x:0, y:1, z:0}, {x:0, y:-1, z:0}
            ];

            for (let o of nearbyOffsets) {
                const k = getCoordsKey(bx + o.x*BLOCK_SIZE, by + o.y*BLOCK_SIZE, bz + o.z*BLOCK_SIZE);
                const mesh = world.data.get(k);
                if (mesh && mesh.userData.type === 'cactus') {
                    const dist = Math.hypot(mob.mesh.position.x - mesh.position.x, mob.mesh.position.z - mesh.position.z);
                    if (dist < 6) { 
                        const now = performance.now();
                        if (now - mob.lastDamageTime > 500) {
                            mob.health--;
                            soundManager.playDamage();
                            particleSystem.spawnDeath(mob.mesh.position.x, mob.mesh.position.y+3, mob.mesh.position.z, currentDim);
                            mob.lastDamageTime = now;
                            if (mob.health <= 0) {
                                if (dimensions[currentDim]) {
                                    dimensions[currentDim].group.remove(mob.mesh);
                                }
                                mob.isDead = true;
                            }
                        }
                    }
                }
            }
        }

        // --- NIGHT ZOMBIE SPAWNING (SINGLEPLAYER) ---
        function attemptNaturalMobSpawning() {
            if (isConnected) return; // Singleplayer Only (Server handles multiplayer)
            // Only spawn at night (timeRatio > 0.5) and check limit
            const timeRatio = (singlePlayerTime % SINGLEPLAYER_DAY_DURATION) / SINGLEPLAYER_DAY_DURATION;
            if (timeRatio < 0.5) return; // It is day
            if (mobs.length > 50) return; // Entity limit

            if (Math.random() < 0.05 && currentDim === 'overworld') { // 5% chance per tick to try spawning
                const world = getActiveWorld();

                // Random offset 15-30 blocks away
                const angle = Math.random() * Math.PI * 2;
                const dist = 15 * BLOCK_SIZE + Math.random() * 15 * BLOCK_SIZE;
                const sx = yawObject.position.x + Math.cos(angle) * dist;
                const sz = yawObject.position.z + Math.sin(angle) * dist;

                // Find ground
                let spawnY = -1000;
                // Scan from sky down
                const checkX = Math.round(sx / BLOCK_SIZE) * BLOCK_SIZE;
                const checkZ = Math.round(sz / BLOCK_SIZE) * BLOCK_SIZE;

                for(let y=30 * BLOCK_SIZE; y > -10 * BLOCK_SIZE; y-=BLOCK_SIZE) {
                    const mesh = world.data.get(getCoordsKey(checkX, y, checkZ));
                    if (mesh && mesh.userData.type !== 'air') {
                        spawnY = y + BLOCK_SIZE;
                        break;
                    }
                }

                if (spawnY > -900) {
                    spawnMob(checkX, spawnY, checkZ, 'zombie', 'overworld', 'clientMob');
                }
            }
        }

        function updatePhysics(delta) {
            const world = getActiveWorld();
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            if(isFlying) velocity.y -= velocity.y * 10.0 * delta;
            else velocity.y -= 9.8 * 70.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            let isMoving = false;
            if (moveForward || moveBackward || moveLeft || moveRight) {
                isMoving = true;
                const input = new THREE.Vector3(direction.x, 0, -direction.z);
                input.applyAxisAngle(new THREE.Vector3(0, 1, 0), yawObject.rotation.y);
                const speed = moveDown ? 150.0 : 400.0; // Slower when sneaking
                velocity.x += input.x * speed * delta;
                velocity.z += input.z * speed * delta;
            }
            if (isFlying) {
                if (moveUp) velocity.y += 400 * delta;
                if (moveDown) velocity.y -= 400 * delta;
            }
            
            // Crouching Camera Height
            const targetHeight = moveDown && !isFlying ? 25 : 30;
            yawObject.position.y += (targetHeight - (yawObject.position.y - (pitchObject.position.y + (yawObject.position.y - 30)))) * 0.2; 
            pitchObject.position.y += ( (moveDown && !isFlying ? -5 : 0) - pitchObject.position.y ) * 0.2;

            let intendedX = yawObject.position.x + velocity.x * delta;
            let intendedZ = yawObject.position.z + velocity.z * delta;

            let onGround = false;
            if (!isFlying) {
                const portalRay = new THREE.Raycaster(yawObject.position, new THREE.Vector3(0, -1, 0), 0, 12);
                const portalHits = portalRay.intersectObjects(world.objects);
                const inPortal = portalHits.some(h => h.object.userData.type === 'portal' && h.distance < 12);
                if (inPortal) { switchDimension(currentDim === 'overworld' ? 'the_end' : 'overworld'); return; }

                const offsets = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(2, 0, 2), new THREE.Vector3(-2, 0, 2), new THREE.Vector3(2, 0, -2), new THREE.Vector3(-2, 0, -2)];
                let groundY = -Infinity; let found = false;
                for(let o of offsets) {
                    const origin = yawObject.position.clone().add(o); const ray = new THREE.Raycaster(origin, new THREE.Vector3(0, -1, 0), 0, 12);
                    const hits = ray.intersectObjects(world.objects); const validHit = hits.find(h => h.object.userData.type !== 'portal');
                    
                    // --- COLLISION CHECK (Ignore 'crop' blocks AND Open Doors) ---
                    if (validHit) { 
                        if(validHit.object.userData.type !== 'crop') {
                            // If it's a door, check if open
                            if (validHit.object.userData.type === 'door' && validHit.object.userData.isOpen) {
                                // Pass through
                            } else {
                                if(validHit.point.y > groundY) { groundY = validHit.point.y; found = true; } 
                            }
                        }
                    }
                }
                if (found) {
                    const dist = yawObject.position.y - 10 - groundY;
                    if (dist < 1.5 && velocity.y <= 0) { velocity.y = 0; yawObject.position.y = groundY + 10; canJump = true; onGround = true; } 
                    else canJump = false;
                } else canJump = false;

                // SHIFT BRIDGING LOGIC
                if (onGround && moveDown) {
                    let safe = false;
                    const testX = intendedX;
                    const testZ = intendedZ;
                    for(let o of offsets) {
                        const origin = new THREE.Vector3(testX, yawObject.position.y, testZ).add(o); 
                        const ray = new THREE.Raycaster(origin, new THREE.Vector3(0, -1, 0), 0, 12);
                        const hits = ray.intersectObjects(world.objects); 
                        const validHit = hits.find(h => h.object.userData.type !== 'portal');
                        if (validHit) { safe = true; break; }
                    }
                    if (!safe) { velocity.x = 0; velocity.z = 0; }
                }
            }

            // Hand Bobbing
            const time = performance.now() / 1000;
            if (isMoving) {
                handGroup.position.y = -0.6 + Math.sin(time * 10) * 0.05;
                handGroup.position.x = 0.8 + Math.cos(time * 10) * 0.05;
            } else {
                // Idle sway
                handGroup.position.y = -0.6 + Math.sin(time * 2) * 0.02;
                handGroup.position.x = 0.8;
            }
            
            // Hand Mining Animation
            if (isMouseDown) {
                handGroup.rotation.x = -0.5 + Math.sin(time * 20) * 0.5; // Fast punch
            } else {
                handGroup.rotation.x = 0;
            }

            if (isMoving && onGround && !isFlying) {
                const dist = yawObject.position.distanceTo(new THREE.Vector3(intendedX, yawObject.position.y, intendedZ)); 
                walkedDistance += dist;
                if (walkedDistance > 15) { 
                    // --- DETECT BLOCK UNDER FEET FOR SOUND ---
                    const origin = yawObject.position.clone();
                    const ray = new THREE.Raycaster(origin, new THREE.Vector3(0, -1, 0), 0, 15);
                    const hits = ray.intersectObjects(world.objects);
                    let type = 'grass';
                    if (hits.length > 0) {
                         // Find top-most non-crop block
                         const hit = hits.find(h => h.object.userData.type !== 'crop');
                         if(hit) type = hit.object.userData.type || 'grass';
                    }
                    soundManager.playFootstep(type); 
                    walkedDistance = 0; 
                }
            }
            
            // COLLISION DETECTION FOR MOVEMENT
            // Simple wall collision prevention
            if(!isFlying && !controls.isLocked) {
                // Just update position if not colliding
            }
            if(!isFlying) {
               const testDir = velocity.clone().normalize();
               const wallRay = new THREE.Raycaster(yawObject.position, testDir, 0, 3);
               const wallHits = wallRay.intersectObjects(world.objects);
               
               // Check if hit is solid (not crop, not open door)
               const solidWall = wallHits.find(h => {
                   const t = h.object.userData.type;
                   const isOpenDoor = (t === 'door' && h.object.userData.isOpen);
                   return t !== 'crop' && t !== 'portal' && !isOpenDoor;
               });

               if(solidWall) {
                   velocity.x = 0; velocity.z = 0;
               }
            }

            yawObject.position.add(velocity.clone().multiplyScalar(delta));

            if (yawObject.position.y < -100) { yawObject.position.set(0, 50, 0); velocity.set(0, 0, 0); if(currentDim === 'the_end') switchDimension('overworld'); }
        }

        function updateMobs(delta) {
            const currentTime = performance.now();
            for (const [key, entity] of networkEntities) {
                if (entity.dim !== currentDim) { entity.mesh.visible = false; continue; }
                entity.mesh.visible = true;
            }
            // Crystal Animation (should be animated online too)
            mobs.filter(m=>m.type === 'end_crystal').forEach(mob=>{
                if (mob.dim !== currentDim || mob.isDead) { mob.mesh.visible = false; return; }
                const rot = mob.mesh.getObjectByName('rotator');
                const rot2 = mob.mesh.getObjectByName('rotator2');
                if (rot) { rot.rotation.y += delta; rot.rotation.x += delta * 0.5; }
                if (rot2) { rot2.rotation.y -= delta; }
                
                const yOffset = Math.sin(performance.now() / 500) * 0.5;
                if (rot) rot.position.y = 2.5 + yOffset;
                if (rot2) rot2.position.y = 2.5 + yOffset;
                return;
            });
            if (!isConnected) {
                mobs.forEach(mob => {
                    if (mob.type === 'end_crystal') return; // Don't do normal mob logic for end crystals
                    if (mob.dim !== currentDim || mob.isDead) { mob.mesh.visible = false; return; }
                    
                    checkCactusDamageLocal(mob);
                    
                    if (currentTime - mob.lastGruntTime > 2000 + Math.random() * 5000) {
                        const dist = mob.mesh.position.distanceTo(yawObject.position);
                        if (dist < 20) { if (mob.type === 'zombie') soundManager.playZombie(dist); if (mob.type === 'villager') soundManager.playVillager(dist); }
                        mob.lastGruntTime = currentTime;
                    }
                    mob.mesh.visible = true; mob.mesh.position.add(mob.velocity.clone().multiplyScalar(delta));
                    
                    // Local Client AI (simplified)
                    let target = null; let minDist = 100; 
                    if (mob.type === 'zombie') {
                        mobs.forEach(other => {
                            if (other.type === 'villager' && !other.isDead && other.dim === currentDim) {
                                const dist = mob.mesh.position.distanceTo(other.mesh.position);
                                if (dist < minDist) { minDist = dist; target = other.mesh.position; }
                            }
                        });
                        if (gameMode === 'survival' && currentDim === mob.dim) {
                             const dist = mob.mesh.position.distanceTo(yawObject.position);
                             if (dist < minDist) { minDist = dist; target = yawObject.position; }
                        }

                        if (minDist < 3 && target) {
                            if (target === yawObject.position) {
                                if (currentTime - mob.lastAttackTime > 1000) {
                                    myHealth--;
                                    soundManager.playDamage();
                                    updateHealthUI();
                                    mob.lastAttackTime = currentTime;
                                    if (myHealth <= 0) {
                                        myHealth = 20;
                                        updateHealthUI();
                                        yawObject.position.set(0, 60, 0);
                                        const ds = document.getElementById('death-screen');
                                        ds.style.display = 'block';
                                        setTimeout(() => ds.style.display = 'none', 2000);
                                    }
                                }
                            } else {
                                const victim = mobs.find(m => m.type === 'villager' && m.mesh.position.equals(target));
                                if (victim) {
                                    if (currentTime - mob.lastAttackTime > 1000) {
                                        soundManager.playDamage(); victim.health--;
                                        if (victim.health <= 0) { if(dimensions[currentDim]) dimensions[currentDim].group.remove(victim.mesh); victim.isDead = true; }
                                        mob.lastAttackTime = currentTime;
                                    }
                                    return; 
                                }
                            }
                        }
                    } else {
                        // Villager Logic
                        mobs.forEach(other => { if (other.type === 'zombie' && !other.isDead && other.dim === currentDim) { const dist = mob.mesh.position.distanceTo(other.mesh.position); if (dist < minDist) { minDist = dist; target = other.mesh.position; } } });
                    }

                    const speed = mob.type === 'zombie' ? 15 : 20; 
                    const moveDir = new THREE.Vector3(0, 0, 0);
                    if (target) {
                        if (mob.type === 'zombie') { moveDir.subVectors(target, mob.mesh.position).normalize(); } 
                        else { moveDir.subVectors(mob.mesh.position, target).normalize(); }
                        const lookAheadDist = 4; const checkPos = mob.mesh.position.clone().add(moveDir.clone().multiplyScalar(lookAheadDist)).add(new THREE.Vector3(0, 5, 0));
                        const cliffRay = new THREE.Raycaster(checkPos, new THREE.Vector3(0, -1, 0), 0, 15); const groundHits = cliffRay.intersectObjects(getActiveWorld().objects);
                        if (groundHits.length > 0) {
                            if (mob.type === 'zombie') mob.mesh.lookAt(target.x, mob.mesh.position.y, target.z); else mob.mesh.lookAt(mob.mesh.position.x + moveDir.x, mob.mesh.position.y, mob.mesh.position.z + moveDir.z);
                            mob.velocity.x = moveDir.x * speed; mob.velocity.z = moveDir.z * speed;
                        } else { mob.velocity.x = 0; mob.velocity.z = 0; }
                    } else { mob.velocity.x *= 0.9; mob.velocity.z *= 0.9; }
                    
                    mob.velocity.y -= 9.8 * 50.0 * delta;
                    if (target && (mob.velocity.x !== 0 || mob.velocity.z !== 0)) {
                        const forwardRay = new THREE.Raycaster(mob.mesh.position, moveDir.normalize(), 0, 4);
                        if (forwardRay.intersectObjects(getActiveWorld().objects).length > 0 && mob.velocity.y <= 0) { mob.velocity.y = 60; }
                    }
                    mob.mesh.position.add(mob.velocity.clone().multiplyScalar(delta));
                    const origin = mob.mesh.position.clone().add(new THREE.Vector3(0, 3, 0)); const ray = new THREE.Raycaster(origin, new THREE.Vector3(0, -1, 0), 0, 10); const hits = ray.intersectObjects(getActiveWorld().objects);
                    if(hits.length > 0) { const groundY = hits[0].point.y; const dist = mob.mesh.position.y - groundY; if (dist < 1.0 && dist > -5.0 && mob.velocity.y <= 0) { mob.velocity.y = 0; mob.mesh.position.y = groundY; } }
                    if(mob.mesh.position.y < -100) mob.isDead = true;
                });
            }
        }

        function updateDayNightCycle(delta) {
            if (currentDim === 'the_end') {
                scene.background = new THREE.Color(0x050505);
                if (scene.fog) scene.fog.color = new THREE.Color(0x050505); // Guard check
                ambientLight.intensity = 0.6;
                // Hide celestials in end
                if (celestialManager) celestialManager.update(worldTimeRatio, yawObject.position, currentDim);
                return;
            }

            // Singleplayer: Advance internal time
            if (!isConnected) {
                singlePlayerTime += delta;
                if (singlePlayerTime > SINGLEPLAYER_DAY_DURATION) singlePlayerTime = 0;
                worldTimeRatio = singlePlayerTime / SINGLEPLAYER_DAY_DURATION;
            }

            const r = worldTimeRatio;
            let skyColor = new THREE.Color(0x87CEEB); // Default Day
            let lightIntensity = 0.6;

            // 0.0 - 0.4: Day
            // 0.4 - 0.5: Sunset
            // 0.5 - 0.9: Night
            // 0.9 - 1.0: Sunrise

            if (r < 0.4) {
                // Day
                skyColor.setHex(0x87CEEB);
                lightIntensity = 0.6;
            } else if (r < 0.5) {
                // Sunset
                const t = (r - 0.4) * 10; // 0 to 1
                skyColor.lerp(new THREE.Color(0x050505), t);
                lightIntensity = THREE.MathUtils.lerp(0.6, 0.1, t);
            } else if (r < 0.9) {
                // Night
                skyColor.setHex(0x050505);
                lightIntensity = 0.1;
            } else {
                // Sunrise
                const t = (r - 0.9) * 10;
                skyColor = new THREE.Color(0x050505).lerp(new THREE.Color(0x87CEEB), t);
                lightIntensity = THREE.MathUtils.lerp(0.1, 0.6, t);
            }

            scene.background = skyColor;
            if (scene.fog) scene.fog.color = skyColor; // Guard check
            ambientLight.intensity = lightIntensity;
            
            // Update celestial bodies
            if (celestialManager) celestialManager.update(worldTimeRatio, yawObject.position, currentDim);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = (time - prevTime) / 1000;
            
            updateDayNightCycle(delta);

            if (controls.isLocked) {
                updatePhysics(delta); 
                raycaster.setFromCamera(center, camera);
                const intersects = raycaster.intersectObjects(getActiveWorld().objects);
                
                // BLOCK HIGHLIGHTING
                if (intersects.length > 0) { 
                    highlightMesh.visible = true; 
                    highlightMesh.position.copy(intersects[0].object.position);
                    
                    // SURVIVAL MINING LOGIC (HOLD TO BREAK)
                    if (gameMode === 'survival' && isMouseDown) {
                         const targetObj = intersects[0].object;
                         // Check Unbreakable
                         if (UNBREAKABLE_BLOCKS.includes(targetObj.userData.type)) {
                             miningProgress = 0;
                             lastTargetBlockUuid = null;
                             crackingMesh.visible = false;
                         } else {
                             const key = getCoordsKey(targetObj.position.x, targetObj.position.y, targetObj.position.z);
                             
                             // --- NEW: MINING SOUND LOOP ---
                             if (time - lastMiningSoundTime > 250) { // Play "thump" every 0.25s
                                 soundManager.playDig(targetObj.userData.type);
                                 lastMiningSoundTime = time;
                                 // --- NEW: SPAWN CHIPS ---
                                 particleSystem.spawnDigging(
                                    targetObj.position.x, 
                                    targetObj.position.y, 
                                    targetObj.position.z, 
                                    targetObj.material.map ? 0xffffff : targetObj.material.color.getHex(), // Simplified color logic, works best for colored blocks not textures but sufficient here
                                    currentDim
                                 );
                             }

                             if (key === lastTargetBlockUuid) {
                                 miningProgress += delta;
                                 
                                 // --- NEW: CRACKING ANIMATION ---
                                 crackingMesh.visible = true;
                                 crackingMesh.position.copy(targetObj.position);
                                 // 0.6s to break, 10 crack stages
                                 const stage = Math.min(9, Math.floor((miningProgress / 0.6) * 10));
                                 crackingMesh.material = crackMaterials[stage];

                                 if (miningProgress > 0.6) { // 0.6s delay
                                     breakBlockInteraction(targetObj);
                                     miningProgress = 0;
                                     crackingMesh.visible = false;
                                 }
                             } else {
                                 lastTargetBlockUuid = key;
                                 miningProgress = 0;
                                 crackingMesh.visible = false;
                             }
                         }
                    } else {
                        miningProgress = 0;
                        lastTargetBlockUuid = null;
                        crackingMesh.visible = false;
                    }
                } else { 
                    highlightMesh.visible = false; 
                    miningProgress = 0;
                    lastTargetBlockUuid = null;
                    crackingMesh.visible = false;
                }

                if (isConnected && time - lastNetworkUpdate > 50) {
                    ws.send(JSON.stringify({ type: 'move', x: yawObject.position.x, y: yawObject.position.y, z: yawObject.position.z, yaw: yawObject.rotation.y, dim: currentDim }));
                    lastNetworkUpdate = time;
                }
            }
            particleSystem.update(delta, currentDim); 
            updateMobs(delta);
            updateDebugInfo(); 
            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
